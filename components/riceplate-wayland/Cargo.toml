[package]
name = "riceplate-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Experimental event-driven native Wayland layer-shell surface for RiceBowl"

[dependencies]
smithay-client-toolkit = { version = "=0.21.1", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "=0.31.14"
wayland-protocols = { version = "=0.32.13", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
# Existing lockfile dependency used only by the external SG5 protocol fixture.
wayland-protocols-misc = { version = "=0.3.12", features = ["client"] }
font8x8 = "=0.3.1"
fontdue = "=0.9.4"
# Pure-Rust HarfBuzz-compatible OpenType shaping for non-ASCII native fonts.
rustybuzz = "=0.20.1"
unicode-bidi = "=0.3.18"
unicode-segmentation = "=1.12.0"
png = "=0.17.16"
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
libc = "=0.2.191"
accesskit = "=0.25.2"
accesskit_unix = "=0.24.1"
# SNI host/watcher, item property changes and DBusMenu actions. This is used
# only when a native recipe actually requests a tray.
status-notifier = "=0.1.1"
