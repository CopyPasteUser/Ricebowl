name: Wayland session preview

on:
  push:
    paths:
      - '.github/workflows/wayland-session.yml'
      - 'macrice/de/**'
      - 'macrice/cli.py'
      - 'macrice/installer.py'
      - 'packaging/wayland/**'
      - 'scripts/build_wayland_session_deb.sh'
      - 'scripts/smoke_wayland_session.sh'
      - 'scripts/smoke_wayland_ricepop.py'
      - 'scripts/check_wayland_panel_outputs.py'
      - 'scripts/capture_luna_labwc.py'
      - 'scripts/smoke_luna_settings_labwc.sh'
      - 'tests/test_de_*.py'
      - 'tests/test_wayland_creator_e2e.py'
      - 'tests/test_wayland_creator_handoff.py'
  pull_request:
    paths:
      - '.github/workflows/wayland-session.yml'
      - 'macrice/de/**'
      - 'macrice/cli.py'
      - 'macrice/installer.py'
      - 'packaging/wayland/**'
      - 'scripts/build_wayland_session_deb.sh'
      - 'scripts/smoke_wayland_session.sh'
      - 'scripts/smoke_wayland_ricepop.py'
      - 'scripts/check_wayland_panel_outputs.py'
      - 'scripts/capture_luna_labwc.py'
      - 'scripts/smoke_luna_settings_labwc.sh'
      - 'tests/test_de_*.py'
      - 'tests/test_wayland_creator_e2e.py'
      - 'tests/test_wayland_creator_handoff.py'

permissions:
  contents: read

jobs:
  session-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install native Wayland compositor and shell dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y labwc waybar foot fuzzel swaylock swaybg \
            xwayland dbus-user-session dbus-x11 xdg-desktop-portal \
            xdg-desktop-portal-gtk xdg-desktop-portal-wlr \
            wayland-utils
          sudo apt-get install -y grim wlr-randr python3-pil python3-gi \
            gir1.2-gtk-3.0 librsvg2-common mako-notifier libnotify-bin
      - name: Validate and test isolated session runtime
        run: |
          /usr/bin/python3 -m compileall -q macrice/de macrice/cli.py
          /usr/bin/python3 -m unittest discover -s tests -p 'test_de_*.py' -v
          /usr/bin/python3 -m unittest tests.test_wayland_creator_e2e tests.test_wayland_creator_handoff -v
          # Session-specific DesktopNames is valid for display managers but
          # desktop-file-validate only knows ordinary application entries.
          sh -n scripts/build_wayland_session_deb.sh
          sh -n scripts/test_wayland_package_reproducibility.sh
          sh -n scripts/smoke_wayland_session.sh
          /usr/bin/python3 -m py_compile scripts/smoke_wayland_ricepop.py
      - name: Build non-installed login session package
        run: |
          sh scripts/build_wayland_session_deb.sh
          dpkg-deb --field dist/ricebowl-wayland-session_0.1.0~preview3_all.deb
          sh scripts/test_wayland_package_reproducibility.sh
      - name: Boot actual labwc and Waybar headlessly
        run: |
          RICEBOWL_SMOKE_RICEPOP=1 timeout -k 5s 60s sh scripts/smoke_wayland_session.sh
          timeout -k 5s 45s sh scripts/smoke_wayland_session.sh chrome
          timeout -k 5s 45s sh scripts/smoke_wayland_session.sh classic
          RICEBOWL_SMOKE_OUTPUTS=2 timeout -k 5s 60s sh scripts/smoke_wayland_session.sh classic
      - name: Capture real Luna GTK system UI under native labwc
        run: |
          mkdir -p dist/luna-labwc
          sh -n scripts/smoke_luna_settings_labwc.sh
          /usr/bin/python3 -m py_compile scripts/capture_luna_labwc.py
          timeout -k 5s 95s sh scripts/smoke_luna_settings_labwc.sh "$PWD/dist/luna-labwc"
      - name: Preserve actual labwc composited Luna GTK pixels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ricebowl-luna-system-labwc-${{ github.sha }}
          path: |
            dist/luna-labwc/luna-labwc-*.png
            dist/luna-labwc/luna-labwc-receipt.json
          if-no-files-found: warn
          retention-days: 14
