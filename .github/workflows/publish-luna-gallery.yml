name: Publish verified Luna Wayland gallery

on:
  push:
    branches:
      - feat/luna-gallery-refresh-20261113
    paths:
      - .github/workflows/publish-luna-gallery.yml
      - scripts/publish_luna_gallery.py
      - screenshots/wayland/README.md
      - README.md
      - WAYLAND_XP_LUNA_PARITY.md
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out the screenshot branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install offline image codec
        run: sudo apt-get update -qq && sudo apt-get install -y python3-pil
      - name: Download proven successful labwc capture artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/luna-source"
          gh run download 43354447753 \
            --repo CopyPasteUser/Ricebowl \
            --name riceplate-native-preview-c0bdb46c87da1e8eb5b5408e7d96f5509d4c7e76 \
            --dir "$RUNNER_TEMP/luna-source"
      - name: Publish reproducible real compositor screenshots
        run: |
          /usr/bin/python3 scripts/publish_luna_gallery.py \
            --source "$RUNNER_TEMP/luna-source" \
            --destination screenshots/wayland
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for p in sorted(Path("screenshots/wayland").glob("luna-*-20261113.webp")):
              with Image.open(p) as image:
                  assert image.size == (1366, 768), p
                  print(f"{p}: {image.size}")
          PY
      - name: Commit generated images and immutable provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/wayland/luna-*-20261113.webp \
                  screenshots/wayland/luna-gallery-provenance-20261113.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "docs(luna): check in authentic 13 Nov labwc captures"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
