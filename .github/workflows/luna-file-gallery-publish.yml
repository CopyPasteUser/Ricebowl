name: Publish native XP Luna file desktop screenshots

on:
  push:
    branches:
      - screenshots/luna-file-desktop-20261114

# This is a one-shot, same-repository capture job. Remove the workflow before
# merging the screenshot PR; regular CI must never gain repository write access.
permissions:
  contents: write

jobs:
  capture:
    if: github.repository == 'CopyPasteUser/Ricebowl' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install isolated native compositor prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libdbus-1-dev pkg-config labwc grim foot xwayland xterm xclip wl-clipboard wlr-randr wtype swaybg fonts-dejavu-core python3-pil python3-gi gir1.2-gtk-3.0 dbus-user-session dbus-x11 dpkg-dev binutils xdg-desktop-portal xdg-desktop-portal-gtk xdg-desktop-portal-wlr libglib2.0-bin pipewire
      - name: Build exact branch revision
        run: |
          cargo build --locked --release --manifest-path components/riceplate-wayland/Cargo.toml
          cargo build --locked --release --manifest-path components/riceplate-wayland/Cargo.toml --example wayland_pointer_click
          sh -n scripts/smoke_riceplate_native.sh
          /usr/bin/python3 -m py_compile scripts/publish_luna_file_gallery.py
      - name: Capture genuine XP Luna XDG desktop frames and verify real input
        run: |
          mkdir -p dist/riceplate-native-preview
          timeout -k 5s 145s sh scripts/smoke_riceplate_native.sh
      - name: Validate and encode compositor captures with provenance
        run: |
          /usr/bin/python3 scripts/publish_luna_file_gallery.py \
            --source dist/riceplate-native-preview \
            --destination screenshots/wayland \
            --source-commit "$GITHUB_SHA" --ci-run "$GITHUB_RUN_ID"
      - name: Commit only the four verified WebP frames and provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/screenshots/luna-file-desktop-20261114
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            screenshots/wayland/luna-file-desktop-before-20261114.webp \
            screenshots/wayland/luna-file-desktop-live-20261114.webp \
            screenshots/wayland/luna-file-desktop-selected-20261114.webp \
            screenshots/wayland/luna-file-desktop-folder-20261114.webp \
            screenshots/wayland/luna-file-desktop-provenance-20261114.json
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git commit -m 'docs(wayland): publish four verified native XP Luna file desktop captures [skip ci]'
          git push origin HEAD:refs/heads/screenshots/luna-file-desktop-20261114
