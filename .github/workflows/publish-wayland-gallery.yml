name: Publish verified Wayland gallery screenshots

on:
  push:
    branches: [docs/wayland-gallery-20261113]
    paths: ['.github/workflows/publish-wayland-gallery.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  import-native-luna:
    if: github.ref == 'refs/heads/docs/wayland-gallery-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUN_ID: '43368674306'
      SOURCE_SHA: 'bdbae75b4c3fbc1c721fed4c20a231c227ef0a54'
      ARTIFACT_NAME: 'riceplate-native-preview-bdbae75b4c3fbc1c721fed4c20a231c227ef0a54'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the image decoder
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil

      - name: Accept only the successful native main-branch capture
        shell: bash
        run: |
          set -euo pipefail
          info="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          test "$(jq -r '.conclusion' <<< "$info")" = success
          test "$(jq -r '.head_sha' <<< "$info")" = "$SOURCE_SHA"
          test "$(jq -r '.head_branch' <<< "$info")" = main
          test "$(jq -r '.path' <<< "$info")" = .github/workflows/riceplate-native.yml
          test "$(jq -r '.event' <<< "$info")" = push

      - name: Download the immutable CI capture artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-captures"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/native-captures"
          test -s "$RUNNER_TEMP/native-captures/capture-manifest.json"

      - name: Verify, import and audit all 8 screenshots
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/import_native_wayland_gallery.py \
            --source "$RUNNER_TEMP/native-captures" \
            --destination screenshots/wayland \
            --ci-run "$RUN_ID" --source-commit "$SOURCE_SHA"
          /usr/bin/python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          path = Path("screenshots/wayland")
          data = json.loads((path / "luna-gallery-provenance-20261113.json").read_text())
          assert len(data["images"]) == 8
          for item in data["images"]:
              img = path / item["preview"]
              assert img.is_file(), img
              assert hashlib.sha256(img.read_bytes()).hexdigest() == item["preview_sha256"]
              assert f"({img.name})" in (path / "README.md").read_text()
          PY
          git diff --check

      - name: Commit the verified assets to this documentation branch
        shell: bash
        run: |
          set -euo pipefail
          git add screenshots/wayland/luna-*-20261113.webp \
            screenshots/wayland/luna-gallery-provenance-20261113.json
          if git diff --cached --quiet; then
            echo "Verified captures already current"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "docs(wayland): refresh authentic Luna compositor screenshots"
          git push origin "HEAD:$GITHUB_REF_NAME"
